<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Country Explorer</title>
    <style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
    font-family: Arial, sans-serif;
    background: #f1f5f9;
    color: #1e293b;
    min-height: 100vh;
    padding: 40px 20px;
}

.container {
    max-width: 750px;
    margin: 0 auto;
    background: #fff;
    padding: 35px;
    border-radius: 16px;
    box-shadow: 0 8px 30px rgba(0, 0, 0, .08);
}

header { text-align: center; margin-bottom: 35px; }
header h1 { font-size: 32px; color: #166534; margin-bottom: 12px; }
header p { color: #64748b; line-height: 1.6; }
.search-section { margin-bottom: 25px; }
label { display: block; font-weight: bold; margin-bottom: 10px; }
.search-box { display: flex; gap: 10px; }

input {
    flex: 1;
    min-width: 0;
    padding: 13px;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    font-size: 16px;
    outline: none;
}
input:focus { border-color: #16a34a; box-shadow: 0 0 0 3px rgba(22, 163, 74, .12); }

button {
    padding: 13px 22px;
    background: #15803d;
    color: white;
    border: 0;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
}
button:hover { background: #166534; }
button:disabled { background: #94a3b8; cursor: not-allowed; }

.loading { text-align: center; padding: 20px; color: #2563eb; font-weight: bold; }
.error {
    background: #fef2f2;
    color: #b91c1c;
    border: 1px solid #fecaca;
    border-radius: 8px;
    padding: 15px;
    margin: 20px 0;
    line-height: 1.5;
}
.hidden { display: none; }

.country-card {
    margin-top: 25px;
    border: 1px solid #e2e8f0;
    border-radius: 12px;
    overflow: hidden;
    animation: appear .3s ease-in-out;
}
.country-header { background: #f0fdf4; padding: 25px; text-align: center; }
.country-flag {
    display: block;
    width: 110px;
    height: auto;
    margin: 0 auto 15px;
    border-radius: 8px;
    box-shadow: 0 8px 18px rgba(15, 23, 42, 0.12);
    background: #fff;
}
.country-header h2 { color: #166534; font-size: 26px; margin-bottom: 8px; }
.official-name { color: #64748b; line-height: 1.5; }

.country-details {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 15px;
    padding: 25px;
}
.detail-item { background: #f8fafc; padding: 15px; border-radius: 8px; overflow-wrap: anywhere; }
.detail-item h3 { font-size: 13px; color: #64748b; margin-bottom: 8px; text-transform: uppercase; }
.detail-item p { font-size: 16px; font-weight: bold; line-height: 1.5; }
footer { margin-top: 30px; text-align: center; color: #94a3b8; font-size: 13px; }

@keyframes appear {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}

@media (max-width: 500px) {
    body { padding: 20px 10px; }
    .container { padding: 20px; }
    header h1 { font-size: 25px; }
    .search-box { flex-direction: column; }
    button { width: 100%; }
    .country-details { grid-template-columns: 1fr; padding: 15px; }
}
    </style>
</head>
<body>
    <main class="container">
        <header>
            <h1>🌍 Country Explorer</h1>
            <p>Discover information about countries around the world.</p>
        </header>

        <section class="search-section">
            <form id="country-form">
                <label for="country-input">Enter a country name</label>
                <div class="search-box">
                    <input id="country-input" type="text" placeholder="e.g. Uganda, Kenya, Japan" required>
                    <button id="search-button" type="submit">Search</button>
                </div>
            </form>
        </section>

        <p id="loading" class="loading hidden">Loading...</p>
        <p id="error-message" class="error hidden" role="alert"></p>
        <section id="country-result" aria-live="polite"></section>

        <footer><p>Powered by REST Countries API v5</p></footer>
    </main>

    <script>
        const COUNTRIES_URL = "https://raw.githubusercontent.com/mledoze/countries/master/countries.json";
        let countriesCache = null;

        const countryForm = document.getElementById("country-form");
        const countryInput = document.getElementById("country-input");
        const searchButton = document.getElementById("search-button");
        const loadingMessage = document.getElementById("loading");
        const errorMessage = document.getElementById("error-message");
        const countryResult = document.getElementById("country-result");

        countryForm.addEventListener("submit", async (event) => {
            event.preventDefault();

            const countryName = countryInput.value.trim();
            if (!countryName) {
                showError("Please enter a country name.");
                return;
            }

            loadingMessage.classList.remove("hidden");
            errorMessage.classList.add("hidden");
            countryResult.replaceChildren();
            searchButton.disabled = true;
            searchButton.textContent = "Searching...";

            try {
                const countries = await getCountries();
                const query = countryName.toLowerCase();
                const country = findCountry(countries, query);

                if (!country) {
                    throw new Error("Country not found. Check the spelling and try again.");
                }

                displayCountry(country);
            } catch (error) {
                if (error instanceof TypeError) {
                    showError("Unable to connect. Check your internet connection and try again.");
                } else {
                    showError(error.message || "Something went wrong. Please try again.");
                }
            } finally {
                loadingMessage.classList.add("hidden");
                searchButton.disabled = false;
                searchButton.textContent = "Search";
            }
        });

        async function getCountries() {
            if (countriesCache) {
                return countriesCache;
            }

            const response = await fetch(COUNTRIES_URL);
            if (!response.ok) {
                throw new Error("Unable to load country data.");
            }

            countriesCache = await response.json();
            return countriesCache;
        }

        function findCountry(countries, query) {
            return countries.find((country) => {
                const names = [
                    country.name && country.name.common,
                    country.name && country.name.official,
                    country.cca2,
                    country.cca3,
                    country.ccn3,
                    ...(country.altSpellings || []),
                    ...(country.demonyms ? Object.values(country.demonyms).map((value) => value.f ? value.f : value) : [])
                ].filter(Boolean).map((value) => String(value).toLowerCase());

                return names.some((name) => name.includes(query) || query.includes(name));
            });
        }

        function displayCountry(country) {
            const names = country.name || {};
            const name = names.common || "Not available";
            const officialName = names.official || "Not available";
            const capital = formatValue(country.capital);
            const region = country.region || "Not available";
            const subregion = country.subregion || "Not available";
            const population = Number.isFinite(country.population)
                ? country.population.toLocaleString()
                : "Not available";
            const area = Number.isFinite(country.area)
                ? country.area.toLocaleString() + " km²"
                : "Not available";
            const languages = formatObjectValues(country.languages);
            const currencies = formatCurrencies(country.currencies);
            const flagSource = "https://flagcdn.com/w320/" + (country.cca2 || "us").toLowerCase() + ".png";

            const card = document.createElement("article");
            card.className = "country-card";

            const header = document.createElement("div");
            header.className = "country-header";

            const flag = document.createElement("img");
            flag.className = "country-flag";
            flag.src = flagSource;
            flag.alt = "Flag of " + name;
            header.appendChild(flag);

            const title = document.createElement("h2");
            title.textContent = name;
            const official = document.createElement("p");
            official.className = "official-name";
            official.textContent = officialName;
            header.append(title, official);

            const details = [
                ["Capital", capital],
                ["Region", region],
                ["Subregion", subregion],
                ["Population", population],
                ["Area", area],
                ["Languages", languages],
                ["Currencies", currencies]
            ];

            const detailsContainer = document.createElement("div");
            detailsContainer.className = "country-details";

            details.forEach(([label, value]) => {
                const item = document.createElement("div");
                item.className = "detail-item";
                const heading = document.createElement("h3");
                heading.textContent = label;
                const paragraph = document.createElement("p");
                paragraph.textContent = value;
                item.append(heading, paragraph);
                detailsContainer.appendChild(item);
            });

            card.append(header, detailsContainer);
            countryResult.replaceChildren(card);
        }

        function formatValue(value) {
            if (Array.isArray(value)) return value.join(", ") || "Not available";
            if (value && typeof value === "object") return Object.values(value).join(", ") || "Not available";
            return value || "Not available";
        }

        function formatObjectValues(value) {
            if (!value || typeof value !== "object") return "Not available";
            return Object.values(value).join(", ") || "Not available";
        }

        function formatCurrencies(currencies) {
            if (!currencies || typeof currencies !== "object") return "Not available";
            const values = Object.entries(currencies);
            if (!values.length) return "Not available";

            return values.map(([code, currency]) => {
                const name = currency && currency.name ? currency.name : code;
                const symbol = currency && currency.symbol ? " (" + currency.symbol + ")" : "";
                return name + symbol;
            }).join(", ");
        }

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.classList.remove("hidden");
        }
    </script>
</body>
</html>
